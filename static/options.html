<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Switchyard settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main>
        <h1>Switchyard settings</h1>
        <form id="settings">
            <label for="gateway-url">Switchyard address</label>
            <input id="gateway-url" type="url" required placeholder="http://127.0.0.1:3260">

            <label for="api-key">API key</label>
            <input id="api-key" type="password" autocomplete="off" placeholder="Only if GATEWAY_API_KEY is set">
            <p class="hint">Without a key, Switchyard must allow this extension's origin: <code id="origin"></code></p>

            <label class="check">
                <input id="ask-before-acting" type="checkbox">
                Ask before clicking or typing on a new site
            </label>

            <div class="actions">
                <button type="submit">Save</button>
                <button id="test" type="button" class="secondary">Test connection</button>
            </div>
            <p id="status" class="status" role="status"></p>
        </form>
    </main>
    <script type="module" src="options.js"></script>
</body>
</html>
