<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Switchyard</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <header class="topbar">
        <span id="bridge-status" class="chip" hidden></span>
        <div class="spacer"></div>
        <button id="new-chat" type="button" class="icon-button" aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
        <button id="open-options" type="button" class="icon-button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        </button>
    </header>

    <main id="scroll">
        <div id="empty" class="empty">
            <img src="icons/icon-128.png" alt="Switchyard" width="56" height="56">
        </div>
        <ol id="messages" class="messages" aria-live="polite"></ol>
    </main>

    <footer class="footer">
        <section id="confirm" class="confirm" hidden>
            <p id="confirm-text"></p>
            <div class="actions">
                <button id="confirm-deny" type="button" class="button outline">Deny</button>
                <button id="confirm-allow" type="button" class="button">Allow</button>
            </div>
        </section>
        <form id="composer" class="composer">
            <ul id="files" class="files" hidden></ul>
            <textarea id="prompt" rows="1" placeholder="How can I help you today?" aria-label="Message"></textarea>
            <div class="composer-bar">
                <button id="attach" type="button" class="icon-button" aria-label="Attach files" title="Attach files">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 0 1 5.7 5.7l-8.6 8.6a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
                </button>
                <input id="file-input" type="file" multiple hidden>
                <div class="spacer"></div>
                <div class="picker">
                    <button id="model-button" type="button" class="model-button" aria-haspopup="menu" aria-expanded="false" title="Model">
                        <span id="model-label">agent</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="model-menu" class="menu" role="menu" hidden></div>
                </div>
                <button id="send" type="submit" class="round-button" aria-label="Send" title="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                </button>
                <button id="stop" type="button" class="round-button stop" aria-label="Stop" title="Stop" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                </button>
            </div>
        </form>
    </footer>
    <script type="module" src="sidepanel.js"></script>
</body>
</html>
