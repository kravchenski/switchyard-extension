<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Switchyard</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <header>
        <h1>Switchyard</h1>
        <select id="model" aria-label="Model" title="Model"></select>
        <button id="new-chat" type="button" class="secondary">New chat</button>
        <button id="open-options" type="button" class="secondary" aria-label="Settings" title="Settings">Settings</button>
    </header>
    <p id="bridge-status" class="bridge-status" hidden></p>
    <main>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <p id="empty" class="hint empty">Ask Switchyard to work with your tabs, e.g. "group my GitHub tabs into a blue group called Code".</p>
        <section id="confirm" class="confirm" hidden>
            <p id="confirm-text"></p>
            <div class="actions">
                <button id="confirm-allow" type="button">Allow</button>
                <button id="confirm-deny" type="button" class="secondary">Deny</button>
            </div>
        </section>
        <details class="tool-runner">
            <summary>Run a tool manually</summary>
            <label for="tool">Tool</label>
            <select id="tool"></select>
            <p id="tool-description" class="hint"></p>
            <label for="args">Arguments (JSON)</label>
            <textarea id="args" rows="4" spellcheck="false">{}</textarea>
            <button id="run" type="button">Run</button>
            <div id="output" class="output" aria-live="polite"></div>
        </details>
    </main>
    <form id="composer" class="composer">
        <textarea id="prompt" rows="3" placeholder="What should Switchyard do?" aria-label="Message"></textarea>
        <div class="actions">
            <button id="send" type="submit">Send</button>
            <button id="stop" type="button" class="secondary" hidden>Stop</button>
        </div>
    </form>
    <script type="module" src="sidepanel.js"></script>
</body>
</html>
